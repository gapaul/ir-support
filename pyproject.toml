[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ir-support"
version = "1.4.3"
description = "Python package including some classes & functions supporting the subject 41013 Industrial Robotics at UTS, along with the Robotics Toolbox for Python"
authors = [
    "41013 Teaching Team <41013@uts.edu.au>",
    "Quang Ngo <quang.ngohominh@gmail.com>",
    "Gavin Paul <gavin.paul-1@uts.edu.au>",
    "Adam Scicluna <Adam.Scicluna@uts.edu.au>",
    "Khoa Nguyen <Khoa.Nguyen@uts.edu.au>"
           ]
packages = [{include = "ir_support"}]
include = [
    "ir_support/**/*.dae",
    "ir_support/**/*.ply",
    "ir_support/**/*.txt",
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
rvc3python = ">=0.9.2,<0.10.0"
swift-sim = ">=1.1.0,<2.0.0"
websockets = ">=10.4,<14.0"
numpy = ">=1.26.4,<2.0.0"
pandas = ">=2.2.3,<3.0.0"
trimesh = ">=4.4.3,<5.0.0"
plyfile = ">=1.1.0,<2.0.0"
keyboard = ">=0.13.5"
scikit-image = ">=0.25.2,<0.26.0"
more-itertools = ">=10.5.0,<11.0.0"
open3d = ">=0.19.0,<0.20.0"
spatialmath-python = ">=1.1.16,<1.2.0"
matplotlib = ">=3.10.0,<3.11.0"
pygame = ">=2.6.1,<3.0.0"
line_profiler = ">=5.0.0,<6.0.0"
fast-simplification = ">=0.1.9,<0.2.0"
openpyxl = ">=3.1.0,<4.0.0"
pytest = ">=8.0.0,<9.0.0"

[tool.poetry.scripts]
ir-support-doctor = "ir_support.doctor:main"

[tool.poetry.urls]
issues = "https://github.com/gapaul/ir-support"


